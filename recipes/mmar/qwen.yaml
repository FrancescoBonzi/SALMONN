# MMAR zero-shot evaluation config for Qwen2.5-Omni

model:
  model_type: "qwen"
  qwen25_omni_path: "pretrained/Qwen2.5-Omni-7B"

  # Unused by Qwen but kept for compatibility with the eval scripts
  prompt_template: "{}"

datasets:
  test_ann_path: "data/MMAR/annotations/test_mmar.json"
  whisper_path: "pretrained/Qwen2.5-Omni-7B"

run:
  seed: 42
  output_dir: "outputs/mmar/qwen_zeroshot"
  device: "cuda"

generate:
  max_new_tokens: 20
  num_beams: 4
  do_sample: False
  temperature: 1.0
  top_p: 0.9
  repetition_penalty: 1.0
