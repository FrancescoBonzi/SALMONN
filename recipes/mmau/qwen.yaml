# MMAU zero-shot evaluation config for Qwen2.5-Omni

model:
  model_type: "qwen25_omni"
  qwen25_omni_path: "Qwen/Qwen2.5-Omni-7B"

  # Unused by Qwen but kept for compatibility with the eval scripts
  prompt_template: "{}"

datasets:
  test_ann_path: "data/MMAU/annotations/test_mmau.json"
  whisper_path: "Qwen/Qwen2.5-Omni-7B"

run:
  seed: 42
  output_dir: "outputs/mmau/qwen25_omni_zeroshot"
  device: "cuda"

generate:
  max_new_tokens: 200
  num_beams: 4
  do_sample: False
  temperature: 1.0
  top_p: 0.9
  repetition_penalty: 1.0
