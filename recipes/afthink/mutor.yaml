# Clotho-AQA Training Config for SALMONN

model:
  model_type: "mutor"

  # MuToR hyperparameters
  mutor_min_offset: 2
  mutor_max_offset: 4
  mutor_alpha: 0.1
  mutor_alpha_decay_temperature: 0.0

  # Model paths (download with: python recipes/download_pretrained.sh)
  llama_path: "pretrained/vicuna-13b-v1.1"
  whisper_path: "pretrained/whisper-large-v2"
  beats_path: "pretrained/BEATs_iter3_plus_AS2M_finetuned_on_AS2M_cpt2.pt"

  ckpt: "pretrained/salmonn_v1.pth"  # Leave empty to train from scratch, or path to pretrained SALMONN checkpoint

  freeze_whisper: True
  freeze_beats: True

  # Window-level Q-Former
  use_speech_Qformer: True
  freeze_speech_QFormer: False
  window_level_Qformer: True
  num_speech_query_token: 1
  second_per_window: 0.333333
  second_stride: 0.333333

  speech_llama_proj_model: ""
  freeze_speech_llama_proj: False

  # LoRA (efficient fine-tuning)
  lora: True
  lora_rank: 8
  lora_alpha: 32
  lora_dropout: 0.1

  multi_prompt: True
  prompt_template: "USER: {}\nASSISTANT:"
  prompt_path: "prompts/train_prompt.json"
  test_prompt_path: "prompts/test_prompt.json"
  max_txt_len: 512
  end_sym: "</s>"

datasets:
  train_ann_path: ""
  valid_ann_path: ""
  test_ann_path: ""

  whisper_path: "pretrained/whisper-large-v2"

run:
  seed: 42
  output_dir: "outputs/mutor"
  evaluate: False
  save_only_best: True

  log_freq: 10
  epoch_based: False
  iters_per_epoch: 4000
  accum_grad_iters: 16
  batch_size_train: 2
  batch_size_eval: 8
  num_workers: 4

  device: "cuda"
  use_distributed: True
  amp: True
  world_size: 1
  dist_url: "env://"

  optims:
    max_epoch: 10
    warmup_steps: 1000
    warmup_start_lr: 1e-6
    init_lr: 2e-5
    min_lr: 1e-6
    weight_decay: 0.05
    beta2: 0.999

generate:
  max_new_tokens: 300
  num_beams: 4
  do_sample: False
  min_length: 1
  temperature: 1.0
  top_p: 0.9
  repetition_penalty: 1.0
  length_penalty: 1.0